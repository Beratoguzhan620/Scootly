# Üretim override'ı: temel dosyayı (docker-compose.yml) genişletir, yerine geçmez.
#   docker compose -p scootly-prod --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml --profile app up -d --build
#
# Eklenenler: yeniden başlatma politikası, kaynak sınırları, log rotasyonu, Production ortamı, AllowedHosts,
# Nginx ters vekil (TLS), Api'nin 2 kopyası.
# Postgres/Redis/RabbitMQ/PaymentSimulator/Api/Mvc portları ana makineye kapatılır; tek giriş Nginx'tir (127.0.0.1:8443).
# Kaynak sınırları İLK TAHMİNDİR; docker stats ile ölçülüp ayarlanmalı.
# Docker "unhealthy" konteyneri kendiliğinden yeniden başlatmaz; restart yalnızca süreç çıkışında devreye girer.
# Nginx'e sabit IP verilir ki Api/Mvc yalnızca onun X-Forwarded-* başlıklarına güvensin (KnownProxies).
# Alt ağ başka bir Docker ağıyla çakışırsa ("Pool overlaps") 10.231.0.0/24 ve 10.231.0.10 değerlerini değiştirin.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  default:
    ipam:
      config:
        - subnet: 10.231.0.0/24
          # Dinamik adresler yalnizca ust yariden (.128-.255) verilir; alt yari sabit adresler icindir (Nginx .10).
          ip_range: 10.231.0.128/25

services:
  postgres:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g

  redis:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m

  rabbitmq:
    restart: unless-stopped
    ports: !reset []
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m

  payment-simulator:
    restart: unless-stopped
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 192m

  api:
    restart: unless-stopped
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS .env.prod dosyasında tanımlanmalı}
      ForwardedHeaders__KnownProxies__0: 10.231.0.10
    logging: *default-logging
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512m

  mvc:
    restart: unless-stopped
    ports: !reset []
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${ALLOWED_HOSTS:?ALLOWED_HOSTS .env.prod dosyasında tanımlanmalı}
      ApiBaseUrl: https://localhost:8443
      ForwardedHeaders__KnownProxies__0: 10.231.0.10
    logging: *default-logging
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  worker:
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Production
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

  nginx:
    profiles: ["app"]
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/upstreams:/etc/nginx/upstreams:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    ports:
      - "127.0.0.1:8443:443"
    networks:
      default:
        ipv4_address: 10.231.0.10
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
      mvc:
        condition: service_healthy
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m