# MAVI : mevcut surum. Servis adlari: api, mvc.
# zone: her nginx isci sureci kendi round-robin sayacini tutmasin diye gerekli (Gun 99 ve 105 olcumleri).
# Docker DNS cok kopyali servis adini tum kopya adreslerine cozer; nginx bunlari acilista ve reload'da okur.
# Kopyalar yenilenince (IP degisince) "nginx -s reload" gerekir.
upstream mvc_upstream {
    zone mvc_upstream 64k;
    server mvc:8080;
}

upstream api_upstream {
    zone api_upstream 64k;
    server api:8080;
}

# SignalR: negotiate ve WebSocket ayni kopyaya dussun diye istemci IP'sine sabitlenir.
upstream api_hub_upstream {
    zone api_hub_upstream 64k;
    ip_hash;
    server api:8080;
}