worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # $uri sorgu dizesini içermez: SignalR token'ı (?access_token=...) erişim loguna yazılmaz.
    # $upstream_addr hangi kopyanın yanıtladığını gösterir.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Upstream tanimlari renge gore ayri dosyalarda; aktif renk active.conf (bkz. docs/runbook/deployment.md, mavi-yesil).
    include /etc/nginx/upstreams/active.conf;

    # Yalnızca konteyner içi sağlık kontrolü için; host'a açılmaz.
    server {
        listen 127.0.0.1:8081;

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        # $http_host istemcinin Host başlığını portuyla (localhost:8443) iletir; $host portu düşürür.
        # DİKKAT: bir location'da kendi proxy_set_header'ı varsa üst düzeydekiler o location'a miras KALMAZ;
        # bu yüzden /hubs/ bloğunda hepsi yeniden yazılır (aksi halde Host = upstream adı olur ve AllowedHosts reddeder).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /hubs/ {
            proxy_pass http://api_hub_upstream;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_upstream;
        }

        location / {
            proxy_pass http://mvc_upstream;
        }
    }
}