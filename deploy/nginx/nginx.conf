worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    # $uri sorgu dizesini içermez: SignalR token'ı (?access_token=...) erişim loguna yazılmaz.
    # $upstream_addr hangi kopyanın yanıtladığını gösterir.
    log_format main '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent rt=$request_time upstream=$upstream_addr';
    access_log /dev/stdout main;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # zone: her isci sureci kendi sayacini tutmasin diye (bkz. api_upstream aciklamasi).
    upstream mvc_upstream {
        zone mvc_upstream 64k;
        server mvc:8080;
    }

    # Docker DNS, çok kopyalı servis adını tüm kopya adreslerine çözer; Nginx bunları açılışta okur.
    # zone olmadan her işçi süreci kendi sayacını tutar ve az istekte dağıtım eşit görünmez.
    upstream api_upstream {
        zone api_upstream 64k;
        server api:8080;
    }

    # SignalR: negotiate ve WebSocket adımları aynı kopyaya düşsün diye istemci IP'sine sabitlenir.
    upstream api_hub_upstream {
        zone api_hub_upstream 64k;
        ip_hash;
        server api:8080;
    }

    # Yalnızca konteyner içi sağlık kontrolü için; host'a açılmaz.
    server {
        listen 127.0.0.1:8081;

        location = /nginx-health {
            access_log off;
            return 200 "ok";
        }
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        proxy_http_version 1.1;
        # $http_host istemcinin Host başlığını portuyla (localhost:8443) iletir; $host portu düşürür.
        # DİKKAT: bir location'da kendi proxy_set_header'ı varsa üst düzeydekiler o location'a miras KALMAZ;
        # bu yüzden /hubs/ bloğunda hepsi yeniden yazılır (aksi halde Host = upstream adı olur ve AllowedHosts reddeder).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /hubs/ {
            proxy_pass http://api_hub_upstream;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Forwarded-For   $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://api_upstream;
        }

        location / {
            proxy_pass http://mvc_upstream;
        }
    }
}