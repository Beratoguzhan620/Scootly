services:
  postgres:
    image: postgres:16
    container_name: scootly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sifre123
      POSTGRES_DB: scootly
    ports:
      - "5432:5432"
    volumes:
      - scootly-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: scootly-redis
    ports:
      - "6379:6379"

volumes:
  scootly-postgres-data: