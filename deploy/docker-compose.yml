# Yerel geliştirme ortamı.
#   Yalnızca altyapı:            docker compose up -d
#   Uygulama servisleri dahil:   docker compose --profile app up -d --build
#   Redpanda stream deneyi:      docker compose --profile experiments up -d redpanda
#   Gözlemlenebilirlik:          docker compose --profile observability up -d
#                                (Seq 5341, Jaeger 16686, Prometheus 9090, Grafana 3001)
#
# İmaj etiketi: SCOOTLY_VERSION ortam değişkeniyle ezilebilir (varsayılan 1.0.0).
# Tüm parolalar ve anahtarlar bu klasördeki .env dosyasından okunur (.env.example'a bakın; .env git'e girmez).
# Portlar yalnızca 127.0.0.1'e açılır: yerel ağdaki başka makineler servislere erişemez.
# Proje adı klasör adından (deploy) gelir; böylece mevcut veritabanı volume'u (deploy_scootly-postgres-data) korunur.

x-app-secrets: &app-secrets
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-scootly};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
  RabbitMq__HostName: rabbitmq
  RabbitMq__UserName: ${RABBITMQ_USER:-scootly}
  RabbitMq__Password: ${RABBITMQ_PASSWORD}
  Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
  PaymentGateway__BaseUrl: http://payment-simulator:8080

# Anonim /health/live ucu olan ASP.NET Core konteynerleri için ortak kontrol (iç port 8080).
# CMD-SHELL kullanılmaz: imajdaki sh dash'tir ve /dev/tcp desteklemez; bash açıkça çağrılır.
# Bu yöntem imajdaki bash, head, grep araçlarına bağlıdır (curl/wget imajda varsayılmaz).
x-http-healthcheck: &http-healthcheck
  test:
    - CMD
    - bash
    - -c
    - exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/live HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 30s

services:
  postgres:
    image: postgres:16.15
    container_name: scootly-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında tanımlanmalı}
      POSTGRES_DB: ${POSTGRES_DB:-scootly}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - scootly-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4
    container_name: scootly-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD .env dosyasında tanımlanmalı}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: scootly-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scootly}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD .env dosyasında tanımlanmalı}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  redpanda:
    profiles: ["experiments"]
    image: docker.redpanda.com/redpandadata/redpanda:v26.2.3
    container_name: scootly-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "127.0.0.1:9092:9092"

  seq:
    profiles: ["observability"]
    image: datalust/seq:2025.1
    container_name: scootly-seq
    environment:
      ACCEPT_EULA: "Y"
    ports:
      - "127.0.0.1:5341:80"

  jaeger:
    profiles: ["observability"]
    image: jaegertracing/all-in-one:1.65.0
    container_name: scootly-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"

  otel-collector:
    profiles: ["observability"]
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: scootly-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    depends_on:
      - jaeger

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.1.0
    container_name: scootly-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - otel-collector

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.4.0
    container_name: scootly-grafana
    environment:
      # Yalnızca yerel geliştirme: anonim erişim yönetici DEĞİL, salt okunur Viewer rolündedir.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD .env dosyasında tanımlanmalı}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus

  # --- Uygulama servisleri (profil: app) ---

  migrator:
    profiles: ["app"]
    image: scootly-migrator:${SCOOTLY_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: src/Scootly.Api/Dockerfile
      target: migrator
    environment:
      <<: *app-secrets
    depends_on:
      postgres:
        condition: service_healthy

  payment-simulator:
    profiles: ["app"]
    image: scootly-payment-simulator:${SCOOTLY_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: src/Scootly.PaymentSimulator/Dockerfile
    environment:
      Webhook__CallbackUrl: http://api:8080/api/webhooks/payment-callback
      Webhook__Secret: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET .env dosyasında tanımlanmalı}
    healthcheck: *http-healthcheck
    ports:
      - "127.0.0.1:5094:8080"

  api:
    profiles: ["app"]
    image: scootly-api:${SCOOTLY_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: src/Scootly.Api/Dockerfile
    environment:
      <<: *app-secrets
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlanmalı}
      DeviceAuth__ClientSecret: ${DEVICE_CLIENT_SECRET:?DEVICE_CLIENT_SECRET .env dosyasında tanımlanmalı}
      PaymentWebhook__Secret: ${PAYMENT_WEBHOOK_SECRET}
      Bootstrap__FleetManagerEmail: ${BOOTSTRAP_FLEET_MANAGER_EMAIL:-}
      Bootstrap__FleetManagerPassword: ${BOOTSTRAP_FLEET_MANAGER_PASSWORD:-}
    healthcheck: *http-healthcheck
    ports:
      - "127.0.0.1:5016:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      payment-simulator:
        condition: service_healthy

  mvc:
    profiles: ["app"]
    image: scootly-mvc:${SCOOTLY_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: src/Scootly.Mvc/Dockerfile
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-scootly};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable"
      Redis__ConnectionString: "redis:6379,password=${REDIS_PASSWORD}"
      PaymentGateway__BaseUrl: http://payment-simulator:8080
      Messaging__Enabled: "false"
      Jwt__Key: ${JWT_KEY:?JWT_KEY .env dosyasında tanımlanmalı}
      Jwt__Issuer: Scootly.Api
      Jwt__Audience: Scootly.Clients
      ApiBaseUrl: http://localhost:5016
    healthcheck: *http-healthcheck
    ports:
      - "127.0.0.1:5096:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["app"]
    image: scootly-worker:${SCOOTLY_VERSION:-1.0.0}
    build:
      context: ..
      dockerfile: src/Scootly.Worker/Dockerfile
    environment:
      <<: *app-secrets
      Worker__HeartbeatPath: /tmp/scootly-worker-heartbeat
    healthcheck:
      # Heartbeat dosyası son 1 dakikada güncellenmediyse süreç sağlıksız sayılır.
      # $$ Compose'un değişken yorumlamasını engeller.
      test: ["CMD-SHELL", "test -n \"$$(find /tmp/scootly-worker-heartbeat -mmin -1 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  scootly-postgres-data: