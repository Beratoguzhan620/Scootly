services:
  postgres:
    image: postgres:16
    container_name: scootly-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sifre123
      POSTGRES_DB: scootly
    ports:
      - "5432:5432"
    volumes:
      - scootly-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: scootly-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: scootly-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: scootly
      RABBITMQ_DEFAULT_PASS: rabbit123

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: scootly-redpanda
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://localhost:9092
    ports:
      - "9092:9092"

volumes:
  scootly-postgres-data: