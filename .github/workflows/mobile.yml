name: Mobil

# Yalnızca mobile/ değişince çalışır: tip, lint ve birim testleri.
# APK burada derlenmez ve yayınlanmaz: açık depoda Actions çıktıları ve Releases herkese açıktır,
# derleme ortamındaki EXPO_PUBLIC_* değerleri de APK'ya düz metin olarak gömülür (mobile/README.md).
on:
  push:
    branches: [main, berat, 'feature/**']
    paths: ['mobile/**', '.github/workflows/mobile.yml']
  pull_request:
    paths: ['mobile/**', '.github/workflows/mobile.yml']

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tip, lint ve testler
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPO_NO_TELEMETRY: 1
    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci

      - run: npm run check
