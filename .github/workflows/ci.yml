name: CI

on:
  push:
    branches: [main, berat, 'feature/**']
  pull_request:

permissions:
  contents: read

# Aynı dala art arda push gelirse eski çalıştırma iptal edilir.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Anahtar paket sürümlerini (Directory.Packages.props) ve proje dosyalarını kapsar.
      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # Derlemeden önce çalışır: yalnızca depodaki dosyalar taranır (bin/obj henüz yok).
      # Test projelerindeki bilinçli sahte parolalar .gitleaks.toml'da dar kapsamla muaf tutulur.
      - name: Secret scan (gitleaks)
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 dir /repo --config /repo/.gitleaks.toml --redact --no-banner

      - name: Restore
        run: dotnet restore Scootly.slnx

      # .editorconfig'e uymayan boşluk/son satır farkı CI'yi durdurur (düzeltmek için: dotnet format whitespace Scootly.slnx).
      - name: Format check
        run: dotnet format whitespace Scootly.slnx --verify-no-changes

      - name: Build
        run: dotnet build Scootly.slnx --configuration Release --no-restore

      # Testcontainers, GitHub'ın Ubuntu çalıştırıcısındaki Docker'ı kullanır.
      # Ölçüm ve deney testleri (Category=Measurement/Experiment) CI'da çalıştırılmaz.
      - name: Test
        run: >
          dotnet test Scootly.slnx --configuration Release --no-build
          --filter "Category!=Measurement&Category!=Experiment&Category!=E2E"
          --logger trx --results-directory TestResults
          --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: TestResults/**/*.trx

      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install --tool-path "$RUNNER_TEMP/reportgenerator" dotnet-reportgenerator-globaltool --version 5.5.11

      # EF migration'ları üretilmiş koddur, oranı yapay olarak düşürür; test assembly'leri de hariç tutulur.
      - name: Generate coverage report
        if: always()
        run: |
          "$RUNNER_TEMP/reportgenerator/reportgenerator" \
            "-reports:TestResults/**/coverage.cobertura.xml" \
            "-targetdir:CoverageReport" \
            "-reporttypes:Html;TextSummary" \
            "-assemblyfilters:+Scootly.*;-Scootly.*Tests*;-Scootly.Testing" \
            "-classfilters:-Scootly.Infrastructure.Migrations.*"
          { echo '## Kapsam raporu'; echo '```'; cat CoverageReport/Summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: CoverageReport/
          if-no-files-found: ignore

      - name: Check vulnerable packages
        run: |
          dotnet list Scootly.slnx package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          if grep -qi "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Güvenlik açığı olan paket bulundu."
            exit 1
          fi

  docker-images:
    runs-on: ubuntu-24.04
    needs: build-and-test
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Build images
        run: |
          docker build -f src/Scootly.Api/Dockerfile -t scootly-api .
          docker build -f src/Scootly.Api/Dockerfile --target migrator -t scootly-migrator .
          docker build -f src/Scootly.Worker/Dockerfile -t scootly-worker .
          docker build -f src/Scootly.PaymentSimulator/Dockerfile -t scootly-payment-simulator .
          docker build -f src/Scootly.Mvc/Dockerfile -t scootly-mvc .

      # Temiz checkout'tan derlenen Mvc imajında Leaflet ve SignalR istemcisi bulunmalı (yerelde git'e girmemiş dosya riskine karşı).
      - name: Verify Mvc static assets
        run: docker run --rm --entrypoint sh scootly-mvc -c "test -s /app/wwwroot/lib/leaflet/leaflet.js && test -s /app/wwwroot/lib/signalr/signalr.min.js"

      # Düzeltmesi yayımlanmış yüksek/kritik açık varsa (işletim sistemi paketi veya NuGet bağımlılığı) iş kırmızıya döner.
      - name: Scan images (Trivy)
        run: |
          for image in scootly-api scootly-migrator scootly-worker scootly-payment-simulator scootly-mvc; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image \
              --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --no-progress "$image"
          done

  # Tarayici testleri ayri bir istir: kirmizi olursa unit/integration isini bloklamaz, onu beklemez de.
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      E2E_ARTIFACTS_DIR: ${{ github.workspace }}/e2e-artifacts

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore tests/Scootly.E2E.Tests

      # E2E projesi Mvc'yi de derler; test sureci Mvc'yi bin/Release altindan ayri surec olarak baslatir.
      - name: Build
        run: dotnet build tests/Scootly.E2E.Tests --configuration Release --no-restore

      - name: Install Playwright browser
        run: pwsh tests/Scootly.E2E.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: E2E tests
        run: >
          dotnet test tests/Scootly.E2E.Tests --configuration Release --no-build
          --filter "Category=E2E"
          --logger trx --results-directory E2EResults

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-failure-artifacts
          path: |
            e2e-artifacts/
            E2EResults/**/*.trx
          if-no-files-found: ignore
