# Android APK: denetim → derleme → emülatörde duman testi → "android-latest" sürümüne yayın.
# main'e her push'ta çalışır; APK, Releases sayfasındaki sabit bağlantıdan telefona indirilebilir.
name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22
  EXPO_NO_TELEMETRY: 1

jobs:
  check:
    name: Tip, lint ve testler
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run check

  build:
    name: APK derle
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # İsteğe bağlı: depo ayarlarında (Settings → Variables) varsayılan API adresi. Boşsa kullanıcı
      # adresi uygulamanın giriş ekranındaki sunucu ayarlarından girer.
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}
      SCOOTLY_VERSION_CODE: ${{ github.run_number }}
      # Telefonlar (32 ve 64 bit ARM) ve CI emülatörü (x86_64).
      ABIS: armeabi-v7a,arm64-v8a,x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          add-job-summary: on-failure

      - run: npm ci

      - name: Android projesini üret (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: React Native'in beklediği NDK sürümünü kur
        run: |
          NDK_VERSION=$(sed -n 's/^ndkVersion = "\(.*\)"/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          echo "NDK $NDK_VERSION"
          if [ ! -d "$ANDROID_HOME/ndk/$NDK_VERSION" ]; then
            set +o pipefail
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
            set -o pipefail
          fi
          test -d "$ANDROID_HOME/ndk/$NDK_VERSION"

      - name: APK derle
        working-directory: android
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8/' gradle.properties
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures="$ABIS" 2>&1 | tee ../gradle.log

      - name: Derleme hatasını özetle
        if: failure()
        run: |
          [ -f gradle.log ] || exit 0
          summary=$(grep -E -A4 "What went wrong|FAILURE:|> Task .* FAILED|^e: |error:|Execution failed" gradle.log | head -c 7000)
          [ -n "$summary" ] || summary=$(tail -c 7000 gradle.log)
          summary="${summary//'%'/'%25'}"
          summary="${summary//$'\r'/'%0D'}"
          summary="${summary//$'\n'/'%0A'}"
          echo "::error title=Gradle derlemesi başarısız::${summary}"

      - name: APK'yı adlandır
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/scootly.apk
          ls -la dist
          unzip -l dist/scootly.apk | grep -E "lib/[^/]+/libreactnative.so" || true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scootly-apk
          path: dist/scootly.apk
          if-no-files-found: error
          retention-days: 14

  smoke:
    name: Emülatörde duman testi
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scootly-apk
          path: dist

      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Sahte API'yi başlat
        run: |
          nohup python3 e2e/mock-api.py --port 5999 > mock-api.log 2>&1 &
          for _ in $(seq 1 20); do curl -fsS http://127.0.0.1:5999/health/ready && break; sleep 1; done

      - name: Emülatörde ana akışı çalıştır
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash e2e/run-android-smoke.sh dist/scootly.apk smoke

      - name: Duman testi hatasını özetle
        if: failure()
        run: |
          [ -f smoke/logcat-cokme.txt ] && echo "::error title=Uygulama çöktü::$(head -c 4000 smoke/logcat-cokme.txt | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')" || true
          [ -f smoke/hata-arayuz.xml ] && echo "::error title=Hata anındaki ekran metinleri::$(grep -o 'text="[^"]\+"' smoke/hata-arayuz.xml | head -60 | tr '\n' ' ' | head -c 4000)" || true
          tail -n 40 mock-api.log || true

      - name: Ekran görüntülerini paketle
        if: always()
        run: |
          [ -d smoke ] || exit 0
          cp mock-api.log smoke/ 2>/dev/null || true
          (cd smoke && zip -qr ../emulator-ekranlari.zip .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: emulator-ekranlari
          path: emulator-ekranlari.zip
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Releases'a yayınla
    needs: [build, smoke]
    # Duman testi başarısız olsa da APK yayınlanır; sonuç sürüm notunda yazar.
    if: always() && needs.build.result == 'success' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scootly-apk
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: emulator-ekranlari
          path: dist

      - name: android-latest sürümünü güncelle
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          case "$SMOKE_RESULT" in
            success) smoke="✅ Emülatörde ana akış (giriş → harita → rezervasyon → sürüş → ödeme) başarıyla geçti." ;;
            *) smoke="⚠️ Emülatör duman testi geçmedi ($SMOKE_RESULT); ayrıntılar için Actions kaydına bakın." ;;
          esac
          cat > notes.md <<EOF
          Son \`main\` derlemesi — commit \`${GITHUB_SHA::7}\`, derleme #${GITHUB_RUN_NUMBER}.

          $smoke

          **Telefona kurulum:** Bu sayfayı telefonda açıp \`scootly.apk\` dosyasını indirin ve açın. İlk kurulumda
          tarayıcıya "bilinmeyen uygulamaları yükleme" izni vermeniz istenir.

          **Sunucu:** Giriş ekranının altındaki *Sunucu: … Değiştir* bağlantısından API adresini girin
          (ör. \`http://192.168.1.20:5017\`). Telefon ve bilgisayar aynı Wi-Fi ağında olmalı.

          Test sürümüdür: hata ayıklama anahtarıyla imzalıdır ve HTTP bağlantısına izin verir.
          EOF
          gh release delete android-latest --yes --cleanup-tag || true
          assets=(dist/scootly.apk)
          [ -f dist/emulator-ekranlari.zip ] && assets+=(dist/emulator-ekranlari.zip)
          gh release create android-latest "${assets[@]}" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test sürümü (son derleme)" \
            --notes-file notes.md
